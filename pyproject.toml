[project]

name = "libfcrypt"
version = "1.2.2"
description = "Simple, symmetric encryption. Courtesy of Fernet."
readme = "README.md"
requires-python = ">=3.9.1"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
  { name = "Franco Magnano", email = "fluffins009@gmail.com" },
]
classifiers = [
	"License :: OSI Approved :: MIT License", "Operating System :: POSIX :: Linux", 
	"Programming Language :: Python :: 3"
]
dependencies = [
  "cryptography>=50.0.2",
]

[project.urls]

Homepage = "https://www.github.com/SrFluff/libfcrypt"
Issues = "https://www.github.com/SrFluff/libfcrypt/issues"

[build-system]

requires = [
	"hatchling >= 1.26"
]
build-backend = "hatchling.build"
