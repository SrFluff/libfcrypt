[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "libfcrypt"
version = "1.1.1"
authors = [
	{ name="Franco Magnano", email="fluffins009@gmail.com" },
]
description = "Simple, symmetric encryption. Courtesy of Fernet."
readme = "README.md"
requires-python = ">=3.9.1"
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: POSIX :: Linux",
	"License :: OSI Approved :: MIT License"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://www.github.com/SrFluff/libfcrypt"
Issues = "https://www.github.com/SrFluff/libfcrypt/issues"
